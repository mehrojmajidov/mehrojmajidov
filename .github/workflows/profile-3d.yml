name: Profile 3D contributions

on:
  schedule:
    - cron: '17 23 * * *' # 04:17 Tashkent
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'mehrojmajidov/mehrojmajidov'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Full history, so publish_single_commit.sh can tell whether it is already one commit.
          fetch-depth: 0

      # USER_TOKEN (classic PAT: read:user, repo) adds private contributions to the
      # radar and language ring. Without it only public activity is counted.
      # The proxy holds the token and adds data/contributions-archive.json to the response.
      - name: Start contribution archive proxy
        env:
          GITHUB_TOKEN: ${{ secrets.USER_TOKEN || github.token }}
        run: |
          nohup python3 scripts/contrib_proxy.py --port 8787 > /dev/null 2>&1 &
          for _ in {1..20}; do
            curl -fsS http://127.0.0.1:8787/health > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Render 3D contribution chart
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: local-proxy
          GITHUB_ENDPOINT: http://127.0.0.1:8787/graphql
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-contrib.json

      - name: Publish as the repository's only commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- profile-3d-contrib
          bash scripts/publish_single_commit.sh "$DEFAULT_BRANCH"
